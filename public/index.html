<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Monitor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>温度・湿度モニター</h1>
        <p>チーム: TEAM_002</p>
      </header>

      <div class="cards">
        <div class="card">
          <span class="label">温度</span>
          <div class="value" id="temperatureValue">--.- °C</div>
        </div>
        <div class="card">
          <span class="label">湿度</span>
          <div class="value" id="humidityValue">--.- %</div>
        </div>
        <div class="card fan-card">
          <span class="label">ファン</span>
          <label class="switch-row" for="fanSwitch">
            <span id="fanState">OFF</span>
            <input id="fanSwitch" type="checkbox" role="switch" />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <p class="fan-status" id="fanStatus" aria-live="polite">待機中</p>
        </div>
      </div>

      <div class="chart-panel">
        <div class="chart-header">
          <div>
            <h2>温湿度の推移</h2>
            <p id="chartSummary">保存データを読み込んでいます</p>
          </div>
          <div class="legend" aria-label="グラフの凡例">
            <span><i class="legend-dot temperature-dot"></i>温度 (°C)</span>
            <span><i class="legend-dot humidity-dot"></i>湿度 (%)</span>
          </div>
        </div>
        <canvas id="chart" width="980" height="360"></canvas>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
